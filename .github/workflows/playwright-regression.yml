name: Playwright Regression Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression-tests:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright test --project=chromium --reporter=list,json

      - name: Verify JSON report exists
        if: ${{ !cancelled() }}
        run: |
          ls -lh test-results/results.json
          node -e "const d = require('./test-results/results.json'); console.log('Suites in results.json:', (d.suites || []).length);"

      - name: Upload JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-json-report
          path: test-results/results.json
          retention-days: 30