name: Playwright Regression Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression-tests:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Playwright BDD specs
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test --project=storage-state-setup --project=chromium

      - name: Verify JSON report exists
        if: ${{ !cancelled() }}
        run: |
          ls -lh test-results/results.json
          node -e "const d = require('./test-results/results.json'); console.log('Suites:', (d.suites || []).length, 'Expected:', d.stats?.expected, 'Unexpected:', d.stats?.unexpected, 'Flaky:', d.stats?.flaky, 'Skipped:', d.stats?.skipped);"

      - name: Upload JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-json-report
          path: test-results/results.json
          retention-days: 30